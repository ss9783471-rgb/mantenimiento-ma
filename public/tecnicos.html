<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d121a"><title>Bandeja de técnicos · Mantenimiento M.A</title><link rel="stylesheet" href="/styles.css"><style>
body{min-height:100vh;background:#0d121a;color:#e8edf2}.inbox-shell{max-width:1040px;margin:0 auto;padding:50px 24px}.inbox-head{display:flex;justify-content:space-between;align-items:end;gap:20px;padding-bottom:24px;border-bottom:1px solid #29323f}.inbox-head h1{font:600 34px/1.1 var(--display);letter-spacing:-.05em;margin:10px 0}.inbox-head p,.inbox-note,.login-copy{color:#9eabb9;font-size:12px;line-height:1.7}.inbox-count{border:1px solid #52635f;padding:10px 14px;color:#aedbd4;font-size:11px}.login-panel{max-width:450px;margin:46px auto;padding:27px;border:1px solid #293847;background:#141c27}.login-panel h2{font:600 20px var(--display);margin:0}.login-panel label{display:block;margin:20px 0 12px;font-size:11px}.login-panel input{display:block;width:100%;margin-top:8px;background:#0d121a;border:1px solid #394554;color:white;padding:12px}.login-panel button,.ticket-actions button{background:#a4d8cf;color:#12201e;border:0;padding:11px 15px;font-weight:700;font-size:11px;cursor:pointer}.login-panel button{width:100%}.inbox-status{font-size:10px;color:#a4d8cf;margin-top:12px;min-height:15px}.ticket-list{display:grid;gap:12px;padding-top:24px}.ticket{display:grid;grid-template-columns:1fr auto;gap:15px;padding:20px;border:1px solid #293847;background:#121b27}.ticket h2{font:600 16px var(--display);margin:0 0 6px}.ticket-meta,.ticket-contact{font-size:10px;color:#a5b2c0;line-height:1.7}.ticket-problem{font-size:12px;line-height:1.7;color:#e0e8ee;margin:14px 0}.ticket-state{font-size:9px;color:#a4d8cf;letter-spacing:.1em}.ticket-actions{display:flex;gap:7px;align-items:center}.ticket-actions select{background:#0d121a;color:#e2e9f0;border:1px solid #394554;padding:9px;font-size:10px}.ticket-actions button{padding:9px 11px}.inbox-empty{padding:45px 20px;text-align:center;border:1px dashed #394554;color:#a4b0be;font-size:12px}.hidden{display:none}.ticket-list[aria-busy=true]{opacity:.5}@media(max-width:650px){.inbox-shell{padding:27px 17px}.inbox-head{align-items:start;flex-direction:column}.ticket{grid-template-columns:1fr}.ticket-actions{justify-content:flex-start}}
</style></head><body><main class="inbox-shell"><header class="inbox-head"><div><div class="eyebrow"><span class="eyebrow-line"></span> MANTENIMIENTO M.A</div><h1>Bandeja de soporte</h1><p>Consultas guardadas en la base de datos del taller.</p></div><div class="inbox-count" id="pending-count">0 NUEVAS</div></header><section class="login-panel" id="login-panel"><h2>Acceso para técnicos</h2><p class="login-copy">Ingresa la clave configurada al iniciar el servidor. La bandeja requiere autenticación.</p><form id="login-form"><label>Clave del equipo<input id="tech-password" type="password" autocomplete="current-password" required></label><button>Ver solicitudes</button></form><div class="inbox-status" id="login-status" aria-live="polite"></div></section><section class="ticket-list hidden" id="ticket-list" aria-live="polite"></section></main><script src="/tecnicos.js" defer></script></body></html>
